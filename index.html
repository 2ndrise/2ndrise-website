<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>2ND RISE – Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0d100d;
    }

    body {
      overflow-x: hidden;
    }

    .landing {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #0d100d;
    }

    .landing img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Smartphone */
    @media (max-width: 700px) {

      .landing {
        width: 100%;
        min-height: 100svh;
      }

      .landing img {
        width: 100%;
        height: auto;
        max-width: none;
      }
    }

    /* Desktop / Tablet */
    @media (min-width: 701px) {

      .landing {
        align-items: center;
      }

      .landing img {
        width: auto;
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
      }
    }
  </style>

</head>

<body>

  <main class="landing">

    <img
      src="./IMG_20260918_234213.png"
      alt="2ND RISE – Coming Soon"
    >

  </main>

</body>

</html>
